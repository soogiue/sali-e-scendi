<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b6b3a">
<title>Segnapunti — Sali e Scendi</title>
<style>
  /* Tema feltro/oro, copiato dall'app: questa pagina resta AUTONOMA (no file condivisi). */
  :root{ --gold:#f3c64b; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; min-height:100%; }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:#fff; min-height:100dvh; display:flex; justify-content:center;
    background-color:#0a5e34;
    background-image:
      radial-gradient(140% 115% at 50% -10%, rgba(38,176,108,.55), rgba(6,64,34,0) 55%),
      radial-gradient(125% 110% at 50% 120%, rgba(0,0,0,.6), rgba(0,0,0,0) 60%),
      repeating-linear-gradient(45deg, rgba(255,255,255,.022) 0 2px, rgba(0,0,0,0) 2px 7px),
      linear-gradient(160deg,#0f7e46,#063f24);
    background-attachment:fixed;
  }
  #app{ width:100%; max-width:540px; padding:12px 12px 28px; }
  h1{ font-size:1.5rem; margin:.2em 0; text-align:center; letter-spacing:1px;
    text-shadow:0 2px 3px rgba(0,0,0,.45), 0 0 26px rgba(243,198,75,.30); }
  .sub{ opacity:.9; font-size:.85rem; text-align:center; margin-bottom:10px; }
  button{
    background:linear-gradient(180deg,#ffd969,#edae2c); color:#3a2a06;
    border:1px solid rgba(255,255,255,.4); border-radius:14px; padding:13px 16px;
    font-size:1.02rem; font-weight:800; letter-spacing:.3px; cursor:pointer;
    box-shadow:0 4px 0 #b8861d, 0 9px 18px rgba(0,0,0,.28); width:100%; margin-top:10px; font-family:inherit;
  }
  button:active{ transform:translateY(3px); box-shadow:0 1px 0 #b8861d, 0 4px 10px rgba(0,0,0,.22); }
  button.ghost{ background:linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,.06)); color:#fff;
    border:1px solid rgba(255,255,255,.3); box-shadow:0 5px 14px rgba(0,0,0,.22); }
  button.mini{ width:auto; margin:0; padding:8px 14px; font-size:1.1rem; border-radius:10px; }
  .panel{
    background:linear-gradient(180deg, rgba(0,0,0,.30), rgba(0,0,0,.16));
    border:1px solid rgba(255,255,255,.10); border-radius:18px; padding:14px; margin:10px 0;
    box-shadow:0 12px 30px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.08);
  }
  label{ display:block; font-size:.85rem; margin:8px 0 4px; opacity:.9; }
  input{ width:100%; padding:12px; border-radius:10px; border:none; font-size:1rem; box-shadow:inset 0 2px 6px rgba(0,0,0,.15); }
  .tiny{ font-size:.74rem; opacity:.85; }
  table{ width:100%; border-collapse:collapse; }
  td,th{ padding:8px; }
  .tot{ text-align:right; font-weight:800; font-size:1.1rem; color:var(--gold); }
  .tot.neg{ color:#ff8a8a; }
  .steprow{ display:flex; align-items:center; justify-content:space-between; gap:6px;
    padding:8px 0; border-bottom:1px solid rgba(255,255,255,.08); }
  .steprow .nm{ flex:1 1 auto; font-weight:700; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .stepper{ display:flex; align-items:center; gap:6px; }
  .stepper .val{ min-width:26px; text-align:center; font-weight:800; font-size:1.05rem; }
  .stepper .cap{ font-size:.62rem; opacity:.7; display:block; text-align:center; }
  .hist{ font-size:.78rem; opacity:.9; }
  .hist .row{ padding:4px 0; border-top:1px solid rgba(255,255,255,.07); }
  .pos{ color:#bfe6c8; } .negp{ color:#ff8a8a; }
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
const app = document.getElementById("app");
const KEY = "segnapunti";

// Regola dei punti, identica al server: indovini → +1+prese, sbagli → -differenza.
function handPoints(d, f){ return d === f ? 1 + f : -Math.abs(d - f); }

let S = load() || { players: [], hands: [] };   // hands: [ [ {d,f,pts}, ... per giocatore ], ... ]
let draft = null;   // mano in inserimento: array di {d,f} per giocatore

function save(){ localStorage.setItem(KEY, JSON.stringify(S)); }
function load(){
  try{ const s = JSON.parse(localStorage.getItem(KEY));
       return (s && Array.isArray(s.players) && Array.isArray(s.hands)) ? s : null; }
  catch(e){ return null; }
}
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

function totals(){
  return S.players.map((_, i) => S.hands.reduce((sum, h) => sum + (h[i] ? h[i].pts : 0), 0));
}

// ---------- viste ----------
function render(){
  if(draft) return renderHand();
  if(S.players.length >= 2) return renderBoard();
  return renderSetup();
}

function renderSetup(){
  const rows = (S.setupNames || ["",""]).map((nm,i)=>
    '<input class="setup-nm" data-i="'+i+'" maxlength="16" placeholder="Giocatore '+(i+1)+'" value="'+esc(nm)+'">'
  ).join("");
  app.innerHTML =
    '<h1>🃏 Segnapunti</h1><p class="sub">Per giocare con le carte vere — nessun login</p>'+
    '<div class="panel"><label>Giocatori (in ordine di tavolo)</label>'+ rows +
      '<button class="ghost" onclick="UI.addName()">+ Aggiungi giocatore</button>'+
      '<button onclick="UI.startGame()">Inizia</button></div>'+
    '<p class="tiny" style="text-align:center"><a href="index.html" style="color:inherit;opacity:.7">← Torna al gioco online</a></p>';
  bindSetupInputs();
}

function bindSetupInputs(){
  document.querySelectorAll(".setup-nm").forEach(inp=>{
    inp.addEventListener("input", ()=>{
      const i = parseInt(inp.dataset.i,10);
      S.setupNames = S.setupNames || ["",""];
      S.setupNames[i] = inp.value;
    });
  });
}

function renderBoard(){
  const t = totals();
  const rows = S.players.map((p,i)=>
    '<tr><td>'+esc(p)+'</td><td class="tot'+(t[i]<0?' neg':'')+'">'+t[i]+'</td></tr>'
  ).join("");
  let hist = "";
  if(S.hands.length){
    hist = '<div class="hist">'+ S.hands.map((h,hi)=>{
      const parts = S.players.map((p,i)=>{
        const pts = h[i] ? h[i].pts : 0;
        return esc(p)+' <span class="'+(pts>=0?'pos':'negp')+'">'+(pts>=0?'+':'')+pts+'</span>';
      }).join(" · ");
      return '<div class="row">Mano '+(hi+1)+': '+parts+'</div>';
    }).reverse().join("") +'</div>';
  }
  app.innerHTML =
    '<h1>🃏 Segnapunti</h1><p class="sub">'+S.hands.length+' '+(S.hands.length===1?'mano giocata':'mani giocate')+'</p>'+
    '<div class="panel"><table>'+rows+'</table></div>'+
    '<button onclick="UI.newHand()">➕ Nuova mano</button>'+
    (S.hands.length ? '<button class="ghost" onclick="UI.undoHand()">↩︎ Annulla ultima mano</button>' : '')+
    (hist ? '<div class="panel">'+hist+'</div>' : '')+
    '<button class="ghost" onclick="UI.newGame()">🗑 Nuova partita</button>';
}

function renderHand(){
  const rows = S.players.map((p,i)=>
    '<div class="steprow"><span class="nm">'+esc(p)+'</span>'+
      stepper("d",i,draft[i].d,"dichiara")+
      stepper("f",i,draft[i].f,"prese")+
    '</div>'
  ).join("");
  app.innerHTML =
    '<h1>Nuova mano</h1><p class="sub">Dichiarate e prese di ogni giocatore</p>'+
    '<div class="panel">'+rows+'</div>'+
    '<button onclick="UI.confirmHand()">Conferma mano</button>'+
    '<button class="ghost" onclick="UI.cancelHand()">Annulla</button>';
}

function stepper(kind, i, val, cap){
  return '<div class="stepper"><div>'+
    '<button class="mini ghost" onclick="UI.step('+i+',\''+kind+'\',-1)">−</button></div>'+
    '<div><span class="val">'+val+'</span><span class="cap">'+cap+'</span></div>'+
    '<div><button class="mini ghost" onclick="UI.step('+i+',\''+kind+'\',1)">+</button></div></div>';
}

// ---------- azioni ----------
const UI = {
  addName(){
    S.setupNames = S.setupNames || ["",""];
    if(S.setupNames.length >= 8){ return; }
    S.setupNames.push("");
    renderSetup();
  },
  startGame(){
    const names = (S.setupNames || []).map(n=>n.trim()).filter(n=>n.length);
    if(names.length < 2){ alert("Servono almeno 2 giocatori."); return; }
    S = { players: names, hands: [] };
    save(); render();
  },
  newHand(){
    draft = S.players.map(()=>({ d:0, f:0 }));
    renderHand();
  },
  step(i, kind, delta){
    const v = Math.min(10, Math.max(0, draft[i][kind] + delta));
    draft[i][kind] = v;
    renderHand();
  },
  confirmHand(){
    const hand = draft.map(x=>({ d:x.d, f:x.f, pts: handPoints(x.d, x.f) }));
    S.hands.push(hand);
    draft = null; save(); render();
  },
  cancelHand(){ draft = null; render(); },
  undoHand(){
    if(!S.hands.length) return;
    if(!confirm("Annullare l'ultima mano?")) return;
    S.hands.pop(); save(); render();
  },
  newGame(){
    if(!confirm("Nuova partita? I punteggi attuali verranno cancellati.")) return;
    S = { players: [], hands: [] };
    localStorage.removeItem(KEY);
    render();
  },
};
window.UI = UI;

// ---------- self-check (money-path: gratis a ogni apertura) ----------
console.assert(handPoints(3,3) === 4,  "esatto: 1+3");
console.assert(handPoints(0,0) === 1,  "zero esatto: 1");
console.assert(handPoints(2,5) === -3, "sbagliato: -diff");
console.assert(handPoints(5,2) === -3, "sbagliato simmetrico");

render();
</script>
</body>
</html>
