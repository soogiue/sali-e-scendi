<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b6b3a">
<title>Segnapunti — Sali e Scendi</title>
<style>
  /* Tema feltro/oro, copiato dall'app: questa pagina resta AUTONOMA (no file condivisi). */
  :root{ --gold:#f3c64b; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; min-height:100%; }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:#fff; min-height:100dvh; display:flex; justify-content:center;
    background-color:#0a5e34;
    background-image:
      radial-gradient(140% 115% at 50% -10%, rgba(38,176,108,.55), rgba(6,64,34,0) 55%),
      radial-gradient(125% 110% at 50% 120%, rgba(0,0,0,.6), rgba(0,0,0,0) 60%),
      repeating-linear-gradient(45deg, rgba(255,255,255,.022) 0 2px, rgba(0,0,0,0) 2px 7px),
      linear-gradient(160deg,#0f7e46,#063f24);
    background-attachment:fixed;
  }
  #app{ width:100%; max-width:540px; padding:12px 12px 28px; }
  h1{ font-size:1.5rem; margin:.2em 0; text-align:center; letter-spacing:1px;
    text-shadow:0 2px 3px rgba(0,0,0,.45), 0 0 26px rgba(243,198,75,.30); }
  .sub{ opacity:.9; font-size:.85rem; text-align:center; margin-bottom:10px; }
  button{
    background:linear-gradient(180deg,#ffd969,#edae2c); color:#3a2a06;
    border:1px solid rgba(255,255,255,.4); border-radius:14px; padding:13px 16px;
    font-size:1.02rem; font-weight:800; letter-spacing:.3px; cursor:pointer;
    box-shadow:0 4px 0 #b8861d, 0 9px 18px rgba(0,0,0,.28); width:100%; margin-top:10px; font-family:inherit;
  }
  button:active{ transform:translateY(3px); box-shadow:0 1px 0 #b8861d, 0 4px 10px rgba(0,0,0,.22); }
  button.ghost{ background:linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,.06)); color:#fff;
    border:1px solid rgba(255,255,255,.3); box-shadow:0 5px 14px rgba(0,0,0,.22); }
  button.mini{ width:auto; margin:0; padding:8px 14px; font-size:1.1rem; border-radius:10px; }
  .panel{
    background:linear-gradient(180deg, rgba(0,0,0,.30), rgba(0,0,0,.16));
    border:1px solid rgba(255,255,255,.10); border-radius:18px; padding:14px; margin:10px 0;
    box-shadow:0 12px 30px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.08);
  }
  label{ display:block; font-size:.85rem; margin:8px 0 4px; opacity:.9; }
  input{ width:100%; padding:12px; border-radius:10px; border:none; font-size:1rem; box-shadow:inset 0 2px 6px rgba(0,0,0,.15); }
  .tiny{ font-size:.74rem; opacity:.85; }
  .steprow{ display:flex; align-items:center; justify-content:space-between; gap:6px;
    padding:8px 0; border-bottom:1px solid rgba(255,255,255,.08); }
  .steprow .nm{ flex:1 1 auto; font-weight:700; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .stepper{ display:flex; align-items:center; gap:10px; }
  .stepper .val{ min-width:34px; text-align:center; font-weight:800; font-size:1.15rem; color:var(--gold); }
  .stepper .val.neg{ color:#ff8a8a; }
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
const app = document.getElementById("app");
const KEY = "segnapunti";

let S = load() || { players: [], scores: [] };   // scores: punteggio corrente per giocatore

function save(){ localStorage.setItem(KEY, JSON.stringify(S)); }
function load(){
  try{ const s = JSON.parse(localStorage.getItem(KEY));
       return (s && Array.isArray(s.players) && Array.isArray(s.scores)) ? s : null; }
  catch(e){ return null; }
}
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

// ---------- viste ----------
function render(){
  if(S.players.length >= 2) return renderBoard();
  return renderSetup();
}

function renderSetup(){
  const rows = (S.setupNames || ["",""]).map((nm,i)=>
    '<input class="setup-nm" data-i="'+i+'" maxlength="16" placeholder="Giocatore '+(i+1)+'" value="'+esc(nm)+'">'
  ).join("");
  app.innerHTML =
    '<h1>🃏 Segnapunti</h1><p class="sub">Per giocare con le carte vere — nessun login</p>'+
    '<div class="panel"><label>Giocatori (in ordine di tavolo)</label>'+ rows +
      '<button class="ghost" onclick="UI.addName()">+ Aggiungi giocatore</button>'+
      '<button onclick="UI.startGame()">Inizia</button></div>'+
    '<p class="tiny" style="text-align:center"><a href="index.html" style="color:inherit;opacity:.7">← Torna al gioco online</a></p>';
  bindSetupInputs();
}

function bindSetupInputs(){
  document.querySelectorAll(".setup-nm").forEach(inp=>{
    inp.addEventListener("input", ()=>{
      const i = parseInt(inp.dataset.i,10);
      S.setupNames = S.setupNames || ["",""];
      S.setupNames[i] = inp.value;
    });
  });
}

function renderBoard(){
  const rows = S.players.map((p,i)=>
    '<div class="steprow"><span class="nm">'+esc(p)+'</span>'+
      '<div class="stepper">'+
        '<button class="mini ghost" onclick="UI.adjust('+i+',-1)">−</button>'+
        '<span class="val'+(S.scores[i]<0?' neg':'')+'">'+S.scores[i]+'</span>'+
        '<button class="mini ghost" onclick="UI.adjust('+i+',1)">+</button>'+
      '</div></div>'
  ).join("");
  app.innerHTML =
    '<h1>🃏 Segnapunti</h1><p class="sub">Tocca + o − per segnare i punti</p>'+
    '<div class="panel">'+rows+'</div>'+
    '<button class="ghost" onclick="UI.newGame()">🗑 Nuova partita</button>';
}

// ---------- azioni ----------
const UI = {
  addName(){
    S.setupNames = S.setupNames || ["",""];
    if(S.setupNames.length >= 8){ return; }
    S.setupNames.push("");
    renderSetup();
  },
  startGame(){
    const names = (S.setupNames || []).map(n=>n.trim()).filter(n=>n.length);
    if(names.length < 2){ alert("Servono almeno 2 giocatori."); return; }
    S = { players: names, scores: names.map(()=>0) };
    save(); render();
  },
  adjust(i, delta){
    S.scores[i] += delta;
    save(); renderBoard();
  },
  newGame(){
    if(!confirm("Nuova partita? I punteggi attuali verranno cancellati.")) return;
    S = { players: [], scores: [] };
    localStorage.removeItem(KEY);
    render();
  },
};
window.UI = UI;

// ---------- self-check (money-path: gratis a ogni apertura) ----------
(function selfCheck(){
  const s = { players:["A","B"], scores:[0,0] };
  s.scores[0] += 1; s.scores[0] -= 1; s.scores[1] -= 1;
  console.assert(s.scores[0] === 0, "adjust: +1 poi -1 torna a 0");
  console.assert(s.scores[1] === -1, "adjust: punteggio negativo ammesso");
})();

render();
</script>
</body>
</html>
